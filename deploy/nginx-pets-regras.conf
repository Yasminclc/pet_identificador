# Regras do site e da API, incluídas pelo site do nginx.
# Instalado em /etc/nginx/snippets/pets_identificator.conf (sobrescrito pelo instalar.sh).
#
#   /api/...             -> API (ligada sob demanda pelo systemd)
#   /static/uploads/...  -> fotos do histórico (direto do disco)
#   todo o resto         -> site (versão web do app, gerada em web/ pelo "npm run build:web")

# Mesmo limite da API (5 MB). O próprio nginx recusa arquivos maiores, já em JSON:
# se o pedido chegasse à API, ela fecharia a conexão no meio e o nginx devolveria 502.
client_max_body_size 5M;
error_page 413 @arquivo_grande;

location @arquivo_grande {
    default_type application/json;
    charset utf-8;
    charset_types application/json;
    return 413 '{"erro": "Arquivo muito grande. O limite é 5 MB."}';
}

# Imagens do histórico servidas direto pelo nginx (não acordam a API)
location /static/uploads/ {
    alias __BACKEND__/static/uploads/;
    expires 7d;
}

# Sem keepalive com o upstream: conexões presas impediriam o desligamento após 15 min
location /api/ {
    proxy_pass http://127.0.0.1:__PORTA_SOCKET__;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 60s;
    proxy_read_timeout 60s;
}

# Site: arquivos com hash no nome (JS, CSS, fontes, imagens) podem ficar em cache por muito tempo
location /_expo/ {
    root __WEB__;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location /assets/ {
    root __WEB__;
    expires 30d;
}

# Páginas: /historico -> historico.html; rota desconhecida -> index.html (o app decide).
# Sem cache, para uma versão nova do site aparecer logo depois do deploy.
location / {
    root __WEB__;
    try_files $uri $uri.html $uri/index.html /index.html;
    add_header Cache-Control "no-cache";
}
