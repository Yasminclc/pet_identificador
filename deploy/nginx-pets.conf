# Site do nginx: só o domínio. O certbot acrescenta o HTTPS neste arquivo, então
# ele é criado uma vez só. As regras ficam no snippet (nginx-pets-regras.conf),
# que o instalar.sh atualiza a cada execução.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMINIO__;

    include snippets/pets_identificator.conf;
}
