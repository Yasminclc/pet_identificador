  <path d="M120 92 L120 98 M110 97 C114 102 120 100 120 98 C120 100 126 102 130 97" fill="none" stroke="#1F4D2C" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M116 101 C116 108 124 108 124 101 Z" fill="#EE7457"/>
  <!-- Bochechas -->
  <circle cx="98" cy="86" r="5" fill="#EE7457" opacity="0.25"/>
  <circle cx="142" cy="86" r="5" fill="#EE7457" opacity="0.25"/>
